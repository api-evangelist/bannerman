aid: bannerman
name: bannerman
description: >-
  Bannerman is a San Francisco-based technology company that operates a security guard
  marketplace, connecting businesses with screened, licensed, insured, and certified
  security professionals. Founded in 2014 (Y Combinator S14) and backed by Slow Ventures,
  FundersClub, and Y Combinator, Bannerman brings software and technology to the
  traditionally manual physical-security-services industry. Its web dashboard lets clients
  book, schedule, and manage on-site security officers, run real-time GPS patrol tracking
  and incident reporting, handle communications, and manage billing from a single
  security-officer-management platform. Clients have included Lyft, WeWork, BMW, Juul, and
  YSL, with service across San Francisco, Los Angeles, New York, and Chicago. No public API,
  developer portal, or machine-readable API artifacts are published at this time.
